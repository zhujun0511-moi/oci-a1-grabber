name: OCI A1 Grab

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: oci-a1-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Configure OCI (secrets → ~/.oci)
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          umask 077
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF

      - name: Grab — 填滿 4/24（1/6+1/6+2/12）
        env:
          SUPPRESS_LABEL_WARNING: "True"
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          AD: ${{ secrets.OCI_AD }}
          SSH_PUB: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -u
          FREE_OCPU=4
          notify() {
            echo ">> $1 | $2"
            gh issue create -R "$REPO" --title "$1" --body "@zhujun0511-moi $2" >/dev/null 2>&1 || echo "(issue 開失敗，僅 log)"
          }
          cur_ocpu() {
            local v
            v=$(oci compute instance list -c "$COMPARTMENT_ID" --all \
                --query "sum(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'].\"shape-config\".ocpus)" \
                --raw-output 2>/dev/null)
            v=${v%%.*}; case "$v" in ''|*[!0-9]*) v=0 ;; esac; echo "$v"
          }
          IMAGE_ID=$(oci compute image list -c "$COMPARTMENT_ID" \
                --operating-system "Canonical Ubuntu" --operating-system-version "24.04" \
                --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC \
                --query 'data[0].id' --raw-output)
          case "$IMAGE_ID" in ocid1.image*) : ;; *) echo "❌ 取映像失敗"; exit 1 ;; esac
          printf '%s\n' "$SSH_PUB" > /tmp/ssh.pub
          END=$(( $(date +%s) + 17400 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            USED=$(cur_ocpu)
            if [ "$USED" -ge "$FREE_OCPU" ]; then
              notify "🎉 OCI 免費額度搶滿 ${USED}/${FREE_OCPU} OCPU" "已全部就位。"
              exit 0
            fi
            if [ "$USED" -lt 2 ]; then OCPU=1; MEM=6; else OCPU=2; MEM=12; fi
            REMAIN=$(( FREE_OCPU - USED ))
            if [ "$OCPU" -gt "$REMAIN" ]; then OCPU=$REMAIN; MEM=$(( OCPU*6 )); fi
            i=$((i+1))
            NAME="mongodb-a1-$(date +%s)"
            
            # 移除 boot-volume-size 參數，改走預設 47GB
            if oci compute instance launch \
                --compartment-id "$COMPARTMENT_ID" --availability-domain "$AD" \
                --shape "VM.Standard.A1.Flex" --shape-config "{\"ocpus\":$OCPU,\"memoryInGBs\":$MEM}" \
                --image-id "$IMAGE_ID" --subnet-id "$SUBNET_ID" --assign-public-ip true \
                --display-name "$NAME" \
                --ssh-authorized-keys-file /tmp/ssh.pub >/tmp/out 2>&1; then
              INST_ID=$(grep -oiE 'ocid1\.instance[a-z0-9._-]+' /tmp/out | head -1)
              IP=""
              for k in 1 2 3 4 5 6; do
                IP=$(oci compute instance list-vnics --instance-id "$INST_ID" --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
                case "$IP" in [0-9]*) break ;; *) IP=""; sleep 10 ;; esac
              done
              notify "✅ 搶到 OCI VM: ${NAME} (${OCPU}c/${MEM}g)" "累計 $((USED+OCPU))/${FREE_OCPU} OCPU。Public IP: ${IP:-建立中}。"
              sleep 45
              continue
            fi
            
            # 嚴格區分：帳號權限/金鑰錯 或 明確設定錯（subnet/AD/映像/參數格式）才停止；
            # 容量不足/限流/5xx/網路瞬斷 一律繼續輪詢（搶容量本就要死纏）。
            if grep -qiE "NotAuthenticated|NotAuthorizedOrNotFound|MissingParameter|Forbidden|InvalidParameter|CannotParseRequest|InvalidImage|does not exist|can not be blank" /tmp/out && ! grep -qiE "Out of host capacity|OutofCapacity" /tmp/out; then
              notify "❌ OCI 搶容量停止：權限/設定錯" "偵測到不可恢復錯誤（權限或設定），需人工修正。詳見 Actions run log。"
              echo "❌ 確定為不可恢復的權限/帳號/設定錯誤，腳本停止："; cat /tmp/out; exit 1
            else
              echo "[$i] $(date -u +%H:%M:%S) 資源不足或暫時性網絡回應，60s 後重試..."
            fi
            sleep 60
          done
          echo "本輪 5h 視窗結束（$(cur_ocpu)/${FREE_OCPU} OCPU），下次排程續搶。"
