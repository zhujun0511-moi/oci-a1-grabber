name: Test Notify (bot)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test-notify.yml']

permissions:
  issues: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: bot open issue mentioning you
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" --title "測試2 — bot 發的，你應該收得到 email" --body "@zhujun0511-moi 這是 github-actions[bot] 發的(不是你自己)。收到這封 email 就代表『搶到 VM 自動開 Issue 通知你(含 Public IP+SSH)』可行，不用弄 Gmail 密碼。收到回我一聲。"
